<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2EC">
<title>Seite nicht gefunden · Doku-Fix</title>
<style>
@font-face{font-family:"Outfit";font-style:normal;font-display:swap;font-weight:100 900;src:url(/fonts/outfit-latin-wght-normal.woff2) format("woff2")}
:root{--grund:#F2F2EC;--flaeche:#FFFFFF;--schrift:#1A1A1A;--schrift2:#5F5F63;--akzent:#4E6E17;--hell:#DDF6A2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--grund:#1A1A1A;--flaeche:#262626;--schrift:#F5F5F0;--schrift2:#B4B4AE;--akzent:#DDF6A2;--hell:#DDF6A2;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--grund);color:var(--schrift);font-family:"Outfit",-apple-system,system-ui,sans-serif;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
::selection{background:var(--hell);color:#1A1A1A}
main{width:100%;max-width:420px;text-align:center}
.zeichen{width:72px;height:72px;margin:0 auto 22px;border-radius:20px;background:var(--flaeche);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.zeichen svg{width:36px;height:36px;color:var(--akzent)}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 10px;text-wrap:balance}
p{margin:0 0 26px;color:var(--schrift2);font-size:1.0625rem;line-height:1.5;text-wrap:pretty}
a.knopf{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;background:var(--hell);color:#1A1A1A;font-weight:700;font-size:1.0625rem;text-decoration:none;transition:transform .16s cubic-bezier(.23,1,.32,1)}
a.knopf:active{transform:scale(.97)}
a.knopf:focus-visible{outline:2px solid var(--akzent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="zeichen" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9.5 13.5 5 5m0-5-5 5"/></svg>
  </div>
  <h1>Diese Seite gibt es nicht</h1>
  <p>Vielleicht hat sich ein Tippfehler in die Adresse geschlichen. Deine Daten sind davon nicht betroffen, sie liegen weiter auf diesem Gerät.</p>
  <a class="knopf" href="/">Zurück zu Doku-Fix</a>
</main>
</body>
</html>
